<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Transaksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md relative">
        <!-- Header -->
        <header class="p-4 border-b flex items-center bg-white sticky top-0 z-10">
            <h1 class="text-lg font-bold ml-4">Tambah Transaksi</h1>
        </header>

        <!-- Form Input -->
        <main class="p-6">
            <form id="transaksiForm" class="space-y-5">
                
                <!-- Kategori Anggaran -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-600">Kategori Anggaran</label>
                    <select id="kategori" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-600 outline-none" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Material">Material / Bahan</option>
                        <option value="Upah">Upah Tukang</option>
                        <option value="DLL">DLL / Operasional</option>
                    </select>
                </div>

                <!-- Jumlah Transaksi -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-600">Jumlah Transaksi (Rp)</label>
                    <input type="number" id="jumlah" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-600 text-xl font-bold" placeholder="0" required>
                </div>

                <!-- Tanggal -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-600">Tanggal</label>
                    <input type="date" id="tanggal" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-600" required>
                </div>

                <!-- Keterangan -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-600">Keterangan / Rincian</label>
                    <input type="text" id="keterangan" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-600" placeholder="Contoh: Semen 50 Sak" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSimpan" class="w-full bg-blue-900 text-white font-bold p-4 rounded-xl mt-6 hover:bg-blue-800 transition shadow-lg">
                    Simpan Transaksi
                </button>
                <p id="statusMsg" class="text-center text-sm font-semibold mt-3 hidden"></p>
            </form>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
